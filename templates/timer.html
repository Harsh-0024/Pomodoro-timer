{% extends "base.html" %}
{% block title %}Timer{% endblock %}
{% block body_class %}page-timer{% endblock %}
{% block page_id %}timer{% endblock %}
{% block content %}
<section class="hero">
  <div class="session-live" aria-live="polite">
    <div class="live-stat">
      <span class="live-val" id="timerSetDisplay">—</span>
      <span class="live-key">set for</span>
    </div>
    <span class="live-divider" aria-hidden="true"></span>
    <div class="live-stat">
      <span class="live-val" id="timerEndsDisplay">—</span>
      <span class="live-key" id="timerEndsKey">ends at</span>
    </div>
    <span class="live-divider" aria-hidden="true"></span>
    <div class="live-stat">
      <span class="live-val" id="timerFocusedDisplay">0:00</span>
      <span class="live-key">focused</span>
    </div>
  </div>

  <div class="timer-layout">
    <div class="timer-panel">
      <div class="timer-ring-wrap countdown-ring-wrap" id="timerRingWrap">
        <svg class="timer-ring" viewBox="0 0 220 220" aria-hidden="true">
          <defs>
            <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#d4bc7c" />
              <stop offset="45%" stop-color="#f0e6d2" />
              <stop offset="100%" stop-color="#9a7b4f" />
            </linearGradient>
          </defs>
          <circle class="ring-track" cx="110" cy="110" r="96" />
          <circle class="ring-progress" id="timerRingProgress" cx="110" cy="110" r="96" />
        </svg>
        <div class="timer-core">
          <p class="phase-label" id="timerPhaseLabel">Timer</p>
          <input type="text" class="time-display countdown-entry" id="timerEntry" value="25:00" aria-label="Timer length: minutes, or h:mm:ss" autocomplete="off" spellcheck="false" enterkeyhint="go" />
          <p class="time-display hidden" id="timerTimeDisplay">25:00</p>
          <p class="cycle-hint" id="timerHint">Tap the time to change it</p>
        </div>
      </div>
      <div class="countdown-quick" id="timerQuick" role="group" aria-label="Quick lengths in minutes">
        <button type="button" class="countdown-pick" data-min="5">5</button>
        <button type="button" class="countdown-pick" data-min="10">10</button>
        <button type="button" class="countdown-pick" data-min="15">15</button>
        <button type="button" class="countdown-pick" data-min="25">25</button>
        <button type="button" class="countdown-pick" data-min="45">45</button>
        <button type="button" class="countdown-pick" data-min="60">60</button>
        <span class="countdown-pick-unit" aria-hidden="true">min</span>
      </div>
      <div class="controls" id="timerControls">
        <button type="button" class="btn btn-primary" id="btnTimerStart">Start</button>
        <button type="button" class="btn btn-primary hidden" id="btnTimerResume">Resume</button>
        <button type="button" class="btn btn-quiet hidden" id="btnTimerPause">Pause</button>
        <button type="button" class="btn btn-primary hidden" id="btnTimerDismiss">Dismiss</button>
        <button type="button" class="btn btn-ghost hidden" id="btnTimerStop">Cancel</button>
      </div>
      <p class="session-notice hidden" id="timerNotice" role="status" aria-live="polite"></p>
    </div>
    <figure class="focus-quote" id="timerQuote" aria-live="polite">
      <blockquote id="timerQuoteText">{{ initial_quote.quote }}</blockquote>
      <figcaption id="timerQuoteAuthor">{{ initial_quote.author }}</figcaption>
    </figure>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/timer.js') }}?v={{ asset_version }}" defer></script>
{% endblock %}
