# Build standalone one-folder bundles on every version tag and attach them
# to a GitHub Release. Trigger:  git tag v1.0.0 && git push origin v1.0.0
name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to create the release / upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon
            label: macos-arm64
          - os: windows-latest
            label: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Same interpreter the installers provision, so the bundled app and
          # a git install behave identically.
          python-version-file: ".python-version"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check version.py matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          file_v=$(python -c "from version import __version__; print(__version__)")
          tag_v="${GITHUB_REF_NAME#v}"
          if [ "$file_v" != "$tag_v" ]; then
            echo "version.py says $file_v but tag is $tag_v" >&2; exit 1
          fi

      - name: Build
        run: python -m PyInstaller --noconfirm muhurata.spec

      # The app has no console, so the test reads the address from the log
      # file the app writes in its data folder.
      - name: Smoke test the bundle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            exe="dist/Muhurata Timer/Muhurata Timer.exe"
            logfile="$(cygpath "$LOCALAPPDATA")/MuhurataTimer/launcher.log"
          else
            exe="dist/Muhurata Timer.app/Contents/MacOS/Muhurata Timer"
            logfile="$HOME/Library/Application Support/MuhurataTimer/launcher.log"
          fi
          "$exe" --no-browser > /dev/null 2>&1 &
          pid=$!
          url=""
          for i in $(seq 1 60); do
            sleep 1
            url=$(grep -o 'running at http://127.0.0.1:[0-9]*' "$logfile" 2>/dev/null | tail -1 | sed 's/running at //')
            [ -n "$url" ] && break
          done
          [ -n "$url" ] || { echo "no address in the log"; cat "$logfile" 2>/dev/null; exit 1; }
          curl -fsS "$url/api/dashboard" > /dev/null
          curl -fsS "$url/dashboard" > /dev/null
          curl -fsS -X POST "$url/api/alive?page=ci" > /dev/null
          curl -fsS "$url/api/cloud/status" > /dev/null
          kill $pid || true
          echo "Smoke test passed on $url"

      # Asset names deliberately carry no version number, so that
      # /releases/latest/download/<name> is a permanent direct-download link
      # the website can use without being updated each release.
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "Muhurata Timer.app" "../Muhurata-Timer-${{ matrix.label }}.zip"

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Muhurata Timer" -DestinationPath "Muhurata-Timer-${{ matrix.label }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Muhurata-Timer-${{ matrix.label }}
          path: Muhurata-Timer-*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          body: |
            **Easiest way to install:** https://harsh-0024.github.io/Pomodoro-timer/

            The files below are the standalone app — no Python needed. The website
            walks you through unzipping and the first launch, and it picks the right
            file for your computer automatically.

            | | |
            |---|---|
            | `Muhurata-Timer-macos-arm64.zip` | Mac with Apple Silicon |
            | `Muhurata-Timer-windows-x64.zip` | Windows, 64-bit |

            Both are unsigned, so your computer shows a warning the first time —
            **Windows:** More info → Run anyway. **Mac:** see the website, Apple needs
            one Terminal command.

            Your data lives outside the app folder, so replacing the folder with a newer version keeps your history.
