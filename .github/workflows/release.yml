# Build standalone one-folder bundles on every version tag and attach them
# to a GitHub Release. Trigger:  git tag v1.0.0 && git push origin v1.0.0
name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to create the release / upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon
            label: macos-arm64
          - os: windows-latest
            label: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Same interpreter the installers provision, so the bundled app and
          # a git install behave identically.
          python-version-file: ".python-version"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check version.py matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          file_v=$(python -c "from version import __version__; print(__version__)")
          tag_v="${GITHUB_REF_NAME#v}"
          if [ "$file_v" != "$tag_v" ]; then
            echo "version.py says $file_v but tag is $tag_v" >&2; exit 1
          fi

      - name: Build
        run: python -m PyInstaller --noconfirm muhurata.spec

      # The app has no console, so the test reads the address from the log
      # file the app writes in its data folder.
      - name: Smoke test the bundle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            exe="dist/Muhurta Pomodoro/Muhurta Pomodoro.exe"
            logfile="$(cygpath "$LOCALAPPDATA")/MuhurataTimer/launcher.log"
          else
            exe="dist/Muhurta Pomodoro.app/Contents/MacOS/Muhurta Pomodoro"
            logfile="$HOME/Library/Application Support/MuhurataTimer/launcher.log"
          fi
          "$exe" --no-browser > /dev/null 2>&1 &
          pid=$!
          url=""
          for i in $(seq 1 60); do
            sleep 1
            # || true: the log does not exist for the first second or two
            url=$(grep -o 'running at http://127.0.0.1:[0-9]*' "$logfile" 2>/dev/null | tail -1 | sed 's/running at //' || true)
            [ -n "$url" ] && break
          done
          [ -n "$url" ] || { echo "no address in the log"; cat "$logfile" 2>/dev/null; exit 1; }
          # Signed out (a fresh install): pages lead to sign-in and data
          # stays locked, while the sign-in page and its checks work.
          code() { curl -sS -o /dev/null -w '%{http_code}' "$@"; }
          expect() { [ "$1" = "$2" ] || { echo "$3: expected $2, got $1"; cat "$logfile"; exit 1; }; }
          expect "$(code "$url/api/dashboard")" 401 "dashboard data while signed out"
          expect "$(code "$url/dashboard")" 302 "dashboard page while signed out"
          expect "$(code "$url/sign-in")" 200 "sign-in page"
          expect "$(code "$url/api/version")" 200 "version check"
          expect "$(code -X POST "$url/api/alive?page=ci")" 204 "window check-in"
          curl -fsS "$url/api/cloud/status" | grep -q '"signed_in": *false' || { echo "cloud status"; exit 1; }
          # The update check has to reach GitHub over HTTPS from the built
          # app. Up to 1.7.0 it silently couldn't, and no copy ever saw an
          # update. A refusal from GitHub (e.g. rate limit) still proves the
          # secure connection works; no connection at all stops the release.
          v=$(curl -fsS "$url/api/version?refresh=1")
          echo "update check: $v"
          case "$v" in
            *'"check_error":null'*|*'"check_error": null'*|*'update server answered'*) ;;
            *) echo "The built app can't check for updates."; exit 1 ;;
          esac
          kill $pid || true
          echo "Smoke test passed on $url"

      # The Windows app draws its own window (pywebview + WebView2). Open it
      # for real: the timer must load in it, starting the app again must
      # bring that window forward, and closing it must stop the app.
      - name: Smoke test the app window (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $data = "$env:LOCALAPPDATA\MuhurataTimer"
          $log = "$data\launcher.log"
          # As friends get it: Explorer's "Extract All" marks every file as
          # downloaded from the internet, which once stopped the window
          # loading (1.9.0) while this test, without the mark, passed.
          Get-ChildItem -Recurse "dist\Muhurta Pomodoro" -File | ForEach-Object {
            Set-Content -Path $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
          # The copy from the step above, if it outlived its shell.
          Stop-Process -Name "Muhurta Pomodoro" -Force -ErrorAction SilentlyContinue
          Start-Sleep 2
          Remove-Item "$data\running.json" -ErrorAction SilentlyContinue
          $before = @(Get-Content $log).Count
          $since = { @(Get-Content $log) | Select-Object -Skip $before }
          # Started directly (no shell), as it runs once a friend has said
          # "Run anyway": the shell would stop here to ask about the mark.
          $start = [System.Diagnostics.ProcessStartInfo]::new((Resolve-Path "dist\Muhurta Pomodoro\Muhurta Pomodoro.exe").Path)
          $start.UseShellExecute = $false
          $p = [System.Diagnostics.Process]::Start($start)
          $opened = $false
          for ($i = 0; $i -lt 60 -and -not $opened; $i++) {
            Start-Sleep 1
            $opened = [bool](& $since | Select-String "window has opened the timer")
          }
          if (-not $opened) { & $since; throw "The app's window did not open the timer." }
          $url = (Get-Content "$data\running.json" | ConvertFrom-Json).url
          $show = Invoke-WebRequest -UseBasicParsing -Method Post -Headers @{ "X-Muhurta" = "1" } "${url}api/window/show"
          if ($show.StatusCode -ne 204) { throw "Starting the app again would not bring its window forward." }
          taskkill /PID $p.Id  # no /F: asks the window to close, like its X button
          if (-not $p.WaitForExit(30000)) { & $since; throw "Closing the window did not stop the app." }
          if (-not (& $since | Select-String "Stopped\.")) { & $since; throw "The app did not stop cleanly." }
          "App window test passed on $url"

      # Asset names deliberately carry no version number, so that
      # /releases/latest/download/<name> is a permanent direct-download link
      # the website can use without being updated each release.
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "Muhurta Pomodoro.app" "../Muhurta-Pomodoro-${{ matrix.label }}.zip"

      # The usual Mac download: open it, drag the app onto Applications.
      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        run: bash packaging/make_dmg.sh "dist/Muhurta Pomodoro.app" "Muhurta-Pomodoro-${{ matrix.label }}.dmg"

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Muhurta Pomodoro" -DestinationPath "Muhurta-Pomodoro-${{ matrix.label }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Muhurta-Pomodoro-${{ matrix.label }}
          path: |
            Muhurta-Pomodoro-*.zip
            Muhurta-Pomodoro-*.dmg

  # The Android app: the same screens, built into a signed .apk (mobile/).
  android:
    runs-on: ubuntu-latest
    env:
      # The release key's fingerprint. Every update must be signed with this
      # key, or phones refuse to install it over the app they have.
      RELEASE_CERT_SHA256: ec5b6e0713d66b1dfc819fab5be141c68bd4c7c1c87ecf852c64279ebab2631d
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          cd mobile && npm ci

      - name: Check version.py matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          file_v=$(python -c "from version import __version__; print(__version__)")
          tag_v="${GITHUB_REF_NAME#v}"
          [ "$file_v" = "$tag_v" ] || { echo "version.py says $file_v but tag is $tag_v" >&2; exit 1; }

      - name: Build the pages and the app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          MUHURTA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MUHURTA_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MUHURTA_KEY_ALIAS: muhurta
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "The ANDROID_KEYSTORE_B64 secret is missing (see mobile/RELEASING.md)." >&2; exit 1; }
          export MUHURTA_KEYSTORE_FILE="$RUNNER_TEMP/muhurta-release.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$MUHURTA_KEYSTORE_FILE"
          cd mobile
          python build_web.py
          npx cap sync android
          cd android && ./gradlew assembleRelease --no-daemon
          rm -f "$MUHURTA_KEYSTORE_FILE"

      - name: Check the app before releasing it
        run: |
          apk=mobile/android/app/build/outputs/apk/release/app-release.apk
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$tools/apksigner" verify --print-certs "$apk" | tee certs.txt
          grep -qi "SHA-256 digest: $RELEASE_CERT_SHA256" certs.txt || { echo "Signed with the wrong key." >&2; exit 1; }
          "$tools/aapt2" dump badging "$apk" | head -1 | tee badging.txt
          want=$(python -c "from version import __version__; print(__version__)")
          grep -q "versionName='$want'" badging.txt || { echo "The app says a different version than version.py." >&2; exit 1; }
          # The pages, the phone's own server and the account code are inside.
          for f in index.html timer.html sign-in.html local-api.js account.js alerts.js mobile-data.js fonts/fonts.css; do
            unzip -l "$apk" "assets/public/$f" > /dev/null || { echo "missing from the app: $f" >&2; exit 1; }
          done
          # Asset name without a version: a permanent link for the website.
          cp "$apk" Muhurta-Pomodoro-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Muhurta-Pomodoro-android
          path: Muhurta-Pomodoro-android.apk

  # The iPhone app: the same screens as a web app on the website (docs/app,
  # GitHub Pages from main). Rebuilt for the tag and committed to main; copies
  # already on phones see the new version.json and update themselves.
  iphone:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Build docs/app from the tagged code
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # The tag's screens, written into main's website folder.
          git checkout "$GITHUB_SHA" -- . ':!docs'
          python mobile/build_web.py --iphone
          want="${GITHUB_REF_NAME#v}"
          grep -q "\"$want\"" docs/app/version.json || { echo "docs/app is not version $want" >&2; exit 1; }
          for f in index.html timer.html sign-in.html sw.js manifest.webmanifest local-api.js account.js pwa.js icons/apple-touch-icon.png; do
            [ -f "docs/app/$f" ] || { echo "missing from the iPhone app: $f" >&2; exit 1; }
          done

      - name: Publish on the website
        run: |
          git reset -q
          git checkout -- . ':!docs/app'
          git add docs/app
          if git diff --cached --quiet; then echo "docs/app already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "iPhone app: ${GITHUB_REF_NAME}"
          git push origin HEAD:main

  release:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.dmg
            artifacts/*.apk
          generate_release_notes: true
          body: |
            **Easiest way to install:** https://harsh-0024.github.io/muhurta-pomodoro/

            The files below are the standalone app — no Python needed. The website
            walks you through unzipping and the first launch, and it picks the right
            file for your computer automatically.

            | | |
            |---|---|
            | `Muhurta-Pomodoro-macos-arm64.dmg` | Mac with Apple Silicon (open it, drag the app to Applications) |
            | `Muhurta-Pomodoro-macos-arm64.zip` | the same Mac app, zipped |
            | `Muhurta-Pomodoro-windows-x64.zip` | Windows, 64-bit |
            | `Muhurta-Pomodoro-android.apk` | Android phones and tablets (Android 7 and later) |
            | iPhone and iPad | no file: open https://harsh-0024.github.io/muhurta-pomodoro/app/ in Safari, then Share → Add to Home Screen |

            On Android, allow installing from your browser once when asked.

            The computer apps are unsigned, so your computer shows a warning the first time —
            **Windows:** More info → Run anyway. **Mac:** System Settings → Privacy &
            Security → Open Anyway (the website shows where).

            Your data lives outside the app folder, so replacing the folder with a newer version keeps your history.
