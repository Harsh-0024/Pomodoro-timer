<script src="theme.js?v=1.6.0"></script>
<script>
  const REPO = "https://github.com/Harsh-0024/muhurta-pomodoro";
  // /releases/latest/download/<file> always resolves to the newest release,
  // so this page never needs updating when a new version ships.
  const BUILDS = {
    mac: {
      file: "Muhurta-Pomodoro-macos-arm64.dmg",
      eyebrow: "Mac · Apple Silicon",
      steps: [
        `If Chrome blocks the file as an <i>unverified download</i>: click the
         download icon at the top right of Chrome, click the file, and choose
         <b>Download unverified file</b>.`,
        `Open your <b>Downloads</b> folder, double-click
         <span class="code">Muhurta-Pomodoro-macos-arm64.dmg</span> and install it.`,
        `Open <b>Muhurta Pomodoro</b> from Launchpad or Applications. The first
         time, your Mac says it could not check the app: click <b>Done</b>.`,
        `Open <b>System Settings → Privacy &amp; Security</b>, scroll down to
         <i>"Muhurta Pomodoro" was blocked</i> and click <b>Open Anyway</b>.
         Confirm with Touch ID or your password, then <b>Open Anyway</b> once more.`,
        `That's it. From now on it opens like any other app, and when a new
         version is out it offers to update itself.`,
      ],
      note: `<b>Steps 3 and 4 happen only once.</b> The warning appears because the app
             is not registered with Apple (that costs $99 a year), not because anything
             is wrong with it.`,
    },
    win: {
      file: "Muhurta-Pomodoro-windows-x64.zip",
      eyebrow: "Windows · 64-bit",
      steps: [
        `Open your <b>Downloads</b> folder, right-click
         <span class="code">Muhurta-Pomodoro-windows-x64.zip</span> and choose
         <b>Extract All</b>.`,
        `Open the extracted <b>Muhurta Pomodoro</b> folder and double-click
         <b>Muhurta Pomodoro.exe</b>.`,
        `Windows says <b>"Windows protected your PC"</b>. Click <b>More info</b>, then
         <b>Run anyway</b>. This happens only the first time.`,
        `The timer opens in its own window. Close it when you are done and the app
         stops by itself.`,
      ],
      note: `<b>Tip:</b> for a Desktop shortcut, right-click <b>Muhurta Pomodoro.exe</b> →
             <b>Send to</b> → <b>Desktop</b>. The warning in step 3 appears because the
             app has no paid publisher certificate, not because anything is wrong.`,
    },
  };

  const params = new URLSearchParams(location.search);
  let os = (params.get("os") || "").toLowerCase();
  if (!BUILDS[os]) os = /Win/i.test(navigator.userAgent) ? "win" : "mac";
  const build = BUILDS[os];
  const url = `${REPO}/releases/latest/download/${build.file}`;

  document.title = `Download Muhurta Pomodoro for ${os === "win" ? "Windows" : "Mac"}`;
  document.getElementById("eyebrow").textContent = build.eyebrow;
  document.getElementById("manual").href = url;
  document.getElementById("walk").innerHTML = build.steps.map((s) => `<li>${s}</li>`).join("");
  document.getElementById("note").innerHTML = build.note;

  const status = document.getElementById("status");
  const statusText = document.getElementById("statusText");

  // Phones can't run it; don't fire a download they can't use.
  if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    status.classList.add("done");
    statusText.textContent = "This needs a computer. Open this page on your Mac or PC to download.";
    document.getElementById("retry").hidden = true;
  } else {
    const go = () => { location.href = url; };
    setTimeout(go, 700);   // let the page paint first, then start the file
    setTimeout(() => {
      status.classList.add("done");
      statusText.textContent = "Download started. Here is what to do next.";
    }, 2600);
    document.getElementById("manual").addEventListener("click", (e) => {
      e.preventDefault();
      go();
    });
  }
</script>
