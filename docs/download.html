<main>
  <div class="container narrow center">

    <h1 id="title">Almost there.</h1>
    <p class="dl-status" id="status"><span class="spin"></span><span id="statusText">Starting your download…</span></p>

    <ol class="steps" id="walk"></ol>
    <p class="quiet small" id="after"></p>
    <div id="folds"></div>

<script src="theme.js?v=1.6.0"></script>
<script>
  const REPO = "https://github.com/Harsh-0024/muhurta-pomodoro";
  // /releases/latest/download/<file> always resolves to the newest release,
  // so this page never needs updating when a new version ships.
  // Three short steps each; the rare cases fold away behind a tap.
  const BUILDS = {
    mac: {
      file: "Muhurta-Pomodoro-macos-arm64.dmg",
      eyebrow: "Mac · Apple Silicon",
      steps: [
        ["Install", "Open the .dmg in Downloads and drag the app to Applications."],
        ["Open it", "Your Mac says it can't check the app. Click Done."],
        ["Allow it once", "Privacy &amp; Security → Open Anyway."],
      ],
      after: "That's it. From now on it opens like any app and updates itself.",
      folds: [
        ["Chrome blocked the file?", "Click the download icon at the top right of Chrome, click the file, and choose <b>Download unverified file</b>."],
        ["Why does my Mac ask?", "The app isn't registered with Apple (that costs $99 a year). Nothing is wrong with it, and you only allow it once."],
      ],
    },
    win: {
      file: "Muhurta-Pomodoro-windows-x64.zip",
      eyebrow: "Windows · 64-bit",
      steps: [
        ["Unzip", "Right-click the .zip in Downloads and choose Extract All."],
        ["Open it", "Double-click Muhurta Pomodoro.exe in the extracted folder."],
        ["Allow it once", "\u201cWindows protected your PC\u201d → More info → Run anyway."],
      ],
      after: "That's it. Close the window when you're done and the app stops.",
      folds: [
        ["Want a Desktop shortcut?", "Right-click <b>Muhurta Pomodoro.exe</b> → <b>Send to</b> → <b>Desktop</b>."],
        ["Why does Windows warn me?", "The app has no paid publisher certificate. Nothing is wrong with it, and you only allow it once."],
      ],
    },
    android: {
      file: "Muhurta-Pomodoro-android.apk",
      eyebrow: "Android · phones and tablets",
      steps: [
        ["Open it", "When the download finishes, tap it (or find it in Files → Downloads)."],
        ["Allow it once", "Android asks about installing from your browser: Settings → Allow from this source, then go back."],
        ["Install", "Tap Install, then open Muhurta and sign in. Your history comes with you."],
      ],
      after: "That's it. A notice in the app tells you when there's a new version.",
      folds: [
        ["\u201cApp not installed\u201d?", "You have an early test copy. Uninstall Muhurta first (your history is in your account), then install this one."],
        ["Play Protect warns about it?", "Tap <b>More details</b> → <b>Install anyway</b>. The app isn't on the Play Store, so Google doesn't know it yet. Nothing is wrong with it."],
      ],
    },
    // Not a file: a web app that installs from Safari and then works offline.
    iphone: {
      web: "app/",
      eyebrow: "iPhone and iPad · in Safari",
      steps: [
        ["Open it", "Tap Open Muhurta above, in Safari."],
        ["Add it", "Tap Share, then Add to Home Screen, then Add."],
        ["Sign in", "Open Muhurta from your Home Screen and sign in. Your history comes with you."],
      ],
      after: "That's it. It opens like an app, works offline, and updates itself.",
      folds: [
        ["Does it work with no internet?", "Yes. After the first time, everything works offline; sessions sync to your account the next time you're online."],
        ["Will it ring with the screen locked?", "Yes, once you allow notifications: in Muhurta, Settings → Notifications → Allow (iOS 16.4 or later). The end of each block then arrives as a notification, even with the phone locked."],
        ["No \u201cAdd to Home Screen\u201d?", "Open the page in <b>Safari</b> (not inside another app). On iOS 16.4 and later it also works from Chrome's Share menu."],
      ],
    },
  };
  const NAMES = { mac: "Mac", win: "Windows", android: "Android", iphone: "iPhone" };

  const params = new URLSearchParams(location.search);
  let os = (params.get("os") || "").toLowerCase();
  // iPadOS says it is a Mac; a touch screen gives it away.
  const onIphone = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (!BUILDS[os]) os = onIphone ? "iphone" : /Android/i.test(navigator.userAgent) ? "android" : /Win/i.test(navigator.userAgent) ? "win" : "mac";
  const build = BUILDS[os];
  const url = build.web || `${REPO}/releases/latest/download/${build.file}`;

  document.title = `Download Muhurta Pomodoro for ${NAMES[os]}`;
  document.getElementById("eyebrow").textContent = build.eyebrow;
  document.getElementById("manual").href = url;
  document.getElementById("walk").innerHTML = build.steps
    .map(([title, line]) => `<li><b>${title}</b><span>${line}</span></li>`).join("");
  document.getElementById("after").textContent = build.after;
  document.getElementById("folds").innerHTML = build.folds
    .map(([q, a]) => `<details class="more"><summary>${q}</summary><p class="quiet small">${a}</p></details>`).join("");

  const status = document.getElementById("status");
  const statusText = document.getElementById("statusText");

  // Don't fire a download the device can't use: a phone can't run the
  // computer versions, nor a computer or an iPhone the Android one.
  const onAndroid = /Android/i.test(navigator.userAgent);
  const wrongDevice = os !== "iphone" && (onIphone || (onAndroid ? os !== "android" : os === "android"));
  if (build.web) {
    // Nothing to download: the app opens in Safari and is added from there.
    status.classList.add("done");
    status.querySelector(".spin").remove();
    statusText.innerHTML = `<a class="btn-download" href="${build.web}">Open Muhurta</a>`;
    if (!onIphone) statusText.innerHTML += ' <span class="quiet small">Open this page on your iPhone to install it.</span>';
    document.getElementById("retry").hidden = true;
  } else if (wrongDevice) {
    status.classList.add("done");
    statusText.textContent = onIphone ? "This is for another kind of device. Get the iPhone app instead."
      : onAndroid ? "This is the computer version. Get the Android app instead."
      : "This is the Android app. Open this page on your Android phone to download it.";
    if (onAndroid) statusText.innerHTML += ' <a href="download.html?os=android">Android app</a>';
    if (onIphone) statusText.innerHTML += ' <a href="download.html?os=iphone">iPhone app</a>';
    document.getElementById("retry").hidden = true;
  } else {
    const go = () => { location.href = url; };
    setTimeout(go, 700);   // let the page paint first, then start the file
    setTimeout(() => {
      status.classList.add("done");
      statusText.textContent = "Download started.";
    }, 2600);
    document.getElementById("manual").addEventListener("click", (e) => {
      e.preventDefault();
      go();
    });
  }
</script>
</body>
