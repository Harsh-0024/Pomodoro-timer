<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Muhurata timer</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23040302'/%3E%3Cg fill='none' stroke='%23d8bd79' stroke-width='4' stroke-linecap='round'%3E%3Ccircle cx='32' cy='32' r='22'/%3E%3Ccircle cx='32' cy='32' r='6'/%3E%3Cpath d='M32 6v14M32 44v14M6 32h14M44 32h14M13.6 13.6l10 10M40.4 40.4l10 10M50.4 13.6l-10 10M23.6 40.4l-10 10'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
</head>
<body class="{% block body_class %}{% endblock %}">
  <div class="ambient" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-mark" aria-hidden="true">
        <svg class="chakra-mark" viewBox="0 0 32 32" focusable="false">
          <circle class="chakra-outer" cx="16" cy="16" r="12.5" />
          <circle class="chakra-inner" cx="16" cy="16" r="3.2" />
          <path class="chakra-spokes" d="M16 3.5v7M16 21.5v7M3.5 16h7M21.5 16h7M7.2 7.2l5 5M19.8 19.8l5 5M24.8 7.2l-5 5M12.2 19.8l-5 5" />
        </svg>
      </span>
      <span class="brand-text">Muhurata<span class="brand-dot">·</span>Timer</span>
    </a>
    <nav class="topnav">
      <a href="{{ url_for('index') }}" class="nav-link{% if request.endpoint == 'index' %} is-active{% endif %}">Timer</a>
      {% block nav_level %}{% endblock %}
      <a href="{{ url_for('settings_page') }}" class="nav-link{% if request.endpoint == 'settings_page' %} is-active{% endif %}">Settings</a>
    </nav>
  </header>
  <main class="main">{% block content %}{% endblock %}</main>
  <footer class="foot">
    <span>4 work · 3 short · 1 long · 76.2% focus ratio</span>
    <span class="foot-sep">·</span>
    <span>1 Muhurat = 48 min · 1 Ghadi = 24 min</span>
  </footer>
  <div id="shortcutsModal" class="modal hidden" role="dialog" aria-labelledby="shortcutsTitle" aria-hidden="true">
    <div class="modal-backdrop" tabindex="-1" aria-hidden="true"></div>
    <div class="modal-sheet">
      <button type="button" class="modal-close" aria-label="Close">×</button>
      <h2 id="shortcutsTitle" class="modal-title">Keyboard shortcuts</h2>
      <ul class="shortcut-list" id="shortcutsList"></ul>
    </div>
  </div>
  <div id="confirmModal" class="modal confirm-modal hidden" role="dialog" aria-labelledby="confirmTitle" aria-describedby="confirmMessage" aria-hidden="true">
    <div class="modal-backdrop" tabindex="-1" aria-hidden="true"></div>
    <div class="modal-sheet confirm-sheet">
      <p class="modal-kicker">Confirm</p>
      <h2 id="confirmTitle" class="modal-title">Are you sure?</h2>
      <p id="confirmMessage" class="modal-copy"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-quiet" id="confirmCancel">Cancel</button>
        <button type="button" class="btn btn-primary" id="confirmAccept">Continue</button>
      </div>
    </div>
  </div>
  <script>window.__PAGE__ = "{% block page_id %}home{% endblock %}";</script>
  <script src="{{ url_for('static', filename='js/dialog.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/shortcuts.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
